name: Personal Docker image

on:
  push:
    tags: ['v*-custom.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toonflowImage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'haipengTian/Toonflow-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select version
        id: release
        env:
          releaseTag: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            [[ $releaseTag =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-custom\.[0-9]+$ ]]
            echo "appVersion=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=${releaseTag#v}" >> "$GITHUB_OUTPUT"
          else
            # ACT: 手动分支构建只验证可构建性，发布须使用固定 custom 标签。
            echo 'appVersion=2.0.9' >> "$GITHUB_OUTPUT"
            echo 'tag=build' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: appVersion=${{ steps.release.outputs.appVersion }}
          tags: ghcr.io/haipengtian/toonflow:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=toonflowServer
          cache-to: type=gha,mode=max,scope=toonflowServer
      - name: Image reference
        if: startsWith(github.ref, 'refs/tags/')
        env:
          imageDigest: ${{ steps.image.outputs.digest }}
          imageTag: ${{ steps.release.outputs.tag }}
        run: |
          printf '镜像：`ghcr.io/haipengtian/toonflow:%s`\n\n部署摘要：`ghcr.io/haipengtian/toonflow@%s`\n' "$imageTag" "$imageDigest" >> "$GITHUB_STEP_SUMMARY"
